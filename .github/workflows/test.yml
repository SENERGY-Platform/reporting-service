name: 'Tests'

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0.12
        ports:
          - 27017:27017
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . )
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        # REQUIRE_MONGO turns a missing database into a failure instead of a skip,
        # so a broken service container cannot make the suite look green.
        env:
          MONGO_TEST_URL: mongodb://localhost:27017
          REQUIRE_MONGO: '1'
        run: go test -race -count=1 ./...
